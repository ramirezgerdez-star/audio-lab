<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Lab - Analizador de Espectro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex items-center justify-center antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-zinc-900 via-zinc-950 to-black">

    <div class="w-full max-w-4xl mx-4 bg-zinc-900/50 backdrop-blur-md border border-zinc-800/80 p-6 rounded-2xl shadow-2xl shadow-black/50">
        
        <header class="flex flex-col border-b border-zinc-800/60 pb-6 mb-6 gap-6">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 via-cyan-400 to-blue-500 bg-clip-text text-transparent">
                        AUDIO LAB
                    </h1>
                    <p class="text-xs text-zinc-400 mt-1 uppercase tracking-wider font-semibold">
                        Analizador de Espectro & DSP en Tiempo Real
                    </p>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="flex flex-col items-end">
                        <label class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest mb-1">Resolución FFT</label>
                        <select id="select-fft" class="bg-zinc-800 border border-zinc-700 text-zinc-200 text-xs rounded-lg block p-2.5 focus:ring-emerald-500 focus:border-emerald-500 font-mono">
                            <option value="256">256 bins</option>
                            <option value="512">512 bins</option>
                            <option value="1024" selected>1024 bins</option>
                            <option value="2048">2048 bins</option>
                        </select>
                    </div>

                    <button id="btn-audio" class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-bold tracking-wide text-zinc-950 bg-emerald-400 hover:bg-emerald-300 rounded-xl transition-all duration-300 shadow-lg shadow-emerald-500/20 gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        Iniciar
                    </button>

                    <button id="btn-pausa" class="hidden inline-flex items-center justify-center px-5 py-2.5 text-sm font-bold tracking-wide text-zinc-200 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 rounded-xl transition-all duration-300 gap-2">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V7zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        Pausar
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 bg-zinc-950/40 border border-zinc-800/40 p-4 rounded-xl">
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between text-xs font-mono text-zinc-400">
                        <span>FRECUENCIA MÍNIMA (F-START)</span>
                        <span id="val-fmin" class="text-cyan-400 font-bold">20 Hz</span>
                    </div>
                    <input id="range-fmin" type="range" min="0" max="4000" value="20" step="10" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-cyan-400">
                </div>

                <div class="flex flex-col gap-2">
                    <div class="flex justify-between text-xs font-mono text-zinc-400">
                        <span>FRECUENCIA MÁXIMA (F-STOP)</span>
                        <span id="val-fmax" class="text-emerald-400 font-bold">8000 Hz</span>
                    </div>
                    <input id="range-fmax" type="range" min="1000" max="22000" value="8000" step="100" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-emerald-400">
                </div>
            </div>
        </header>

        <main class="relative bg-zinc-950/80 border border-zinc-800/50 rounded-xl overflow-hidden p-2 shadow-inner">
            <div class="absolute top-3 left-4 flex items-center gap-2 z-10">
                <span id="status-led" class="w-2 h-2 rounded-full bg-zinc-600 animate-pulse"></span>
                <span id="status-text" class="text-[10px] font-mono tracking-widest text-zinc-500 uppercase">FFT IDLE</span>
            </div>
            
            <canvas id="canvas-espectro" class="w-full h-[320px] block"></canvas>
        </main>
        
        <footer class="mt-4 flex justify-between items-center text-[11px] font-mono text-zinc-500">
            <div id="footer-status">STATUS: READY</div>
            <div id="footer-samplerate">SAMPLE RATE: -- Hz</div>
        </footer>

    </div>

    <script src="app.js"></script>
</body>
</html>
